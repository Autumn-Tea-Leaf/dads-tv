plugins {
    id 'com.android.application'
}

// Where the app loads its screens from.
//   Empty (default): the web files bundled inside the APK (rebuild the APK to update them).
//   A URL, e.g. -PappUrl=https://you.github.io/dads-tv/ : the hosted copy, which updates itself.
def appUrl = project.findProperty('appUrl') ?: ''

android {
    namespace 'tv.dad.app'
    compileSdk 35

    defaultConfig {
        applicationId 'tv.dad.app'
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName '2.0'
        buildConfigField 'String', 'APP_URL', "\"${appUrl}\""
    }

    buildFeatures {
        buildConfig true
    }

    // Android's default leaves folders starting with "_" out of the APK; the ad blocker
    // needs its "_locales" folder, so this is the default list without that rule.
    androidResources {
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // One APK per processor type: the engine's native code is large, so each box only
    // downloads its own. armeabi-v7a runs on both 32- and 64-bit ARM boxes; the x86 ones
    // are for the emulator tests.
    splits {
        abi {
            enable true
            reset()
            include 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
            universalApk false
        }
    }
}

dependencies {
    // Mozilla's web engine (the one in Firefox), bundled so the app doesn't depend on the box's
    // own Android System WebView, which on old boxes is years out of date (Chrome 52 on Dad's).
    // 143 is the last release that supports Android 7; newer ones need Android 8.
    implementation 'org.mozilla.geckoview:geckoview:143.0.20251003115653'
}

// Copy the web app (one folder up from android/) into the APK's assets.
tasks.register('copyWebApp', Copy) {
    from(rootProject.file('..')) {
        include 'index.html', 'app.js', 'channels.js', 'catalog.json', 'vendor/**'
    }
    into layout.projectDirectory.dir('src/main/assets/www')
}

// uBlock Origin (open-source ad blocker, GPLv3, https://github.com/gorhill/uBlock), loaded by
// MainActivity as a built-in extension so the YouTube channels and dramas play without
// YouTube's adverts. Downloaded at build time (a fixed version, checked against its SHA-256)
// rather than kept in this repository.
def uboVersion = '1.76.0'
def uboSha256 = '6f20ff6749193599548770539103069c20948dfcd3e61c3089a67da7bfc3be39'
def uboXpi = layout.buildDirectory.file("adblock/uBlock0_${uboVersion}.xpi")
def uboDir = layout.projectDirectory.dir('src/main/assets/ublock')

tasks.register('fetchAdBlocker') {
    inputs.property('version', uboVersion)
    outputs.file(uboXpi)
    doLast {
        def f = uboXpi.get().asFile
        f.parentFile.mkdirs()
        ant.get(src: "https://github.com/gorhill/uBlock/releases/download/${uboVersion}/uBlock0_${uboVersion}.firefox.signed.xpi",
                dest: f)
        def sha = java.security.MessageDigest.getInstance('SHA-256').digest(f.bytes).encodeHex().toString()
        if (sha != uboSha256) {
            f.delete()
            throw new GradleException("uBlock Origin download has SHA-256 ${sha}, expected ${uboSha256}")
        }
    }
}

tasks.register('copyAdBlocker', Sync) {
    dependsOn 'fetchAdBlocker'
    from(zipTree(uboXpi)) {
        exclude 'META-INF/**'
    }
    // Our own status reporter (see the file), loaded by the blocker's background page.
    from(layout.projectDirectory.dir('src/main/adblock')) {
        into 'js'
    }
    into uboDir
    // Leave the broadcasters' own pages (CCTV, TVB News) completely alone: they are added to
    // the blocker's default "trusted sites", so it only acts on the app's page and YouTube.
    filteringCharset = 'UTF-8'
    filesMatching('js/background.js') {
        filter { String line ->
            line.contains("'moz-extension-scheme',") ? line + " 'cctv.com', 'tvb.com'," : line
        }
    }
    filesMatching('background.html') {
        filter { String line ->
            line.contains('src="js/start.js"') ? line + ' <script src="js/dadtv-status.js" type="module"></script>' : line
        }
    }
    doLast {
        def patched = uboDir.file('js/background.js').asFile.getText('UTF-8')
        def page = uboDir.file('background.html').asFile.getText('UTF-8')
        if (!patched.contains("'cctv.com',") || !page.contains('dadtv-status.js')
                || !uboDir.dir('_locales').asFile.isDirectory()) {
            throw new GradleException('uBlock Origin layout changed: our patches were not applied')
        }
    }
}
preBuild.dependsOn copyWebApp, copyAdBlocker
