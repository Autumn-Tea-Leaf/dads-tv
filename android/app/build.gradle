plugins {
    id 'com.android.application'
}

// Where the app loads its screens from.
//   Empty (default): the web files bundled inside the APK (rebuild the APK to update them).
//   A URL, e.g. -PappUrl=https://you.github.io/dads-tv/ : the hosted copy, which updates itself.
def appUrl = project.findProperty('appUrl') ?: ''

android {
    namespace 'tv.dad.app'
    compileSdk 35

    defaultConfig {
        applicationId 'tv.dad.app'
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName '2.0'
        buildConfigField 'String', 'APP_URL', "\"${appUrl}\""
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // One APK per processor type: the engine's native code is large, so each box only
    // downloads its own. armeabi-v7a runs on both 32- and 64-bit ARM boxes; the x86 ones
    // are for the emulator tests.
    splits {
        abi {
            enable true
            reset()
            include 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
            universalApk false
        }
    }
}

dependencies {
    // Mozilla's web engine (the one in Firefox), bundled so the app doesn't depend on the box's
    // own Android System WebView, which on old boxes is years out of date (Chrome 52 on Dad's).
    // 143 is the last release that supports Android 7; newer ones need Android 8.
    implementation 'org.mozilla.geckoview:geckoview:143.0.20251003115653'
}

// Copy the web app (one folder up from android/) into the APK's assets.
tasks.register('copyWebApp', Copy) {
    from(rootProject.file('..')) {
        include 'index.html', 'app.js', 'channels.js', 'catalog.json', 'vendor/**'
    }
    into layout.projectDirectory.dir('src/main/assets/www')
}
preBuild.dependsOn copyWebApp
