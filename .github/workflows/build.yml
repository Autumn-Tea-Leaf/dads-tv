# Publishes the TV page to GitHub Pages and builds the Android TV app (APK).
# Every Monday it also refreshes the drama/movie catalog, so new shows appear on Dad's TV
# without reinstalling anything (the app loads the published page).
name: Build

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh drama/movie catalog
        if: github.event_name != 'push'
        run: |
          pip install opencc-python-reimplemented
          python tools/build_catalog.py
          git config user.name 'github-actions'
          git config user.email 'github-actions@users.noreply.github.com'
          git add catalog.json
          git commit -m 'Refresh catalog' && git push || echo 'catalog unchanged'

      # The ?v= stamp makes the TV fetch fresh scripts after every update instead of cached ones.
      - name: Stage site
        run: |
          mkdir site && cp index.html app.js channels.js catalog.json site/
          sed -i -E "s/(app|channels)\.js\"/\1.js?v=${GITHUB_SHA::7}\"/g" site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle -p android assembleDebug -PappUrl=https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

      - name: Publish APK as the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk dads-tv.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dads-tv.apk --title '家庭电视' --notes 'Install dads-tv.apk on the TV box.'

  pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
