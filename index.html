<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>爸爸的电视</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --tile: #1f2630;
    --tile-hi: #2a3340;
    --focus: #f2b632;
    --text: #f0f3f6;
    --muted: #9aa4af;
    --accent: #f2b632;
    --warn: #ff7b5c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif; }
  body { overflow: hidden; }

  /* ---------- screens ---------- */
  .screen { position: fixed; inset: 0; display: none; }
  .screen.on { display: block; }
  .scroll { overflow-y: auto; padding: 32px 48px 80px; scroll-behavior: smooth; }
  header { display: flex; justify-content: space-between; align-items: baseline; gap: 24px; margin-bottom: 8px; }
  header h1 { font-size: 44px; margin: 0; }
  #clock { font-size: 34px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .hint { font-size: 24px; color: var(--muted); margin: 0 0 16px; min-height: 32px; }
  .hint b { color: var(--accent); }
  section h2 { font-size: 30px; color: var(--muted); font-weight: 600; margin: 28px 0 14px; }

  /* ---------- live channel tiles ---------- */
  .row { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
  .tile { background: var(--tile); color: var(--text); border: 4px solid transparent; border-radius: 16px;
    padding: 22px 20px; min-height: 140px; text-align: left; cursor: pointer; font: inherit;
    display: flex; flex-direction: column; justify-content: center; gap: 8px; outline: none;
    transition: transform .12s ease, border-color .12s ease; }
  .tile .name { font-size: 36px; font-weight: 700; line-height: 1.15; }
  .tile .sub { font-size: 20px; color: var(--muted); }
  .tile.vod { background: #2a2418; }
  .tile.down .sub::after { content: " · 暂时无法播放"; color: var(--warn); }

  /* ---------- poster cards (dramas, movies) ---------- */
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 22px; }
  .card { background: var(--tile); color: var(--text); border: 4px solid transparent; border-radius: 14px;
    padding: 0; overflow: hidden; text-align: left; cursor: pointer; font: inherit; outline: none;
    transition: transform .12s ease, border-color .12s ease; }
  .card img { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; background: #000; }
  .card .t { font-size: 24px; font-weight: 600; padding: 10px 14px 4px; line-height: 1.3;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card .i { font-size: 18px; color: var(--muted); padding: 0 14px 12px; }
  .card .i em { font-style: normal; color: var(--accent); }

  .tile:focus, .tile:hover, .card:focus, .card:hover { border-color: var(--focus); transform: scale(1.04); background: var(--tile-hi); }

  #searchBox { width: 100%; font: inherit; font-size: 34px; padding: 16px 22px; border-radius: 14px;
    border: 4px solid var(--tile-hi); background: var(--panel); color: var(--text); outline: none; margin-bottom: 24px; }
  #searchBox:focus { border-color: var(--focus); }
  #browseMsg { font-size: 26px; color: var(--muted); }

  /* ---------- player ---------- */
  #player { background: #000; }
  #video, #yt, #yt iframe, #web { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #000; }
  #video { object-fit: contain; }
  #web { overflow: hidden; }
  #web iframe { position: absolute; left: 0; top: 0; border: 0; transform-origin: 0 0; background: #000; }
  .hidden { display: none !important; }

  #osd { position: absolute; left: 40px; top: 32px; padding: 18px 28px; border-radius: 14px; max-width: 80%;
    background: rgba(0,0,0,.72); font-size: 34px; font-weight: 700; transition: opacity .3s; pointer-events: none; }
  #osd small { display: block; font-size: 22px; font-weight: 400; color: var(--muted); margin-top: 4px; }
  #status { position: absolute; left: 50%; bottom: 120px; transform: translateX(-50%);
    padding: 16px 30px; border-radius: 14px; background: rgba(0,0,0,.78); font-size: 30px;
    pointer-events: none; text-align: center; max-width: 90%; }
  #status.warn { color: var(--warn); }
  .fade { opacity: 0; }

  #bar { position: absolute; left: 0; right: 0; bottom: 0; display: flex; flex-wrap: wrap; gap: 14px; justify-content: center;
    padding: 20px; background: linear-gradient(transparent, rgba(0,0,0,.85)); transition: opacity .3s; }
  #bar button { font: inherit; font-size: 24px; padding: 12px 22px; border-radius: 12px; border: 0;
    background: rgba(255,255,255,.15); color: var(--text); cursor: pointer; }
  #bar button:hover { background: var(--accent); color: #000; }

  @media (max-width: 700px) {
    .scroll { padding: 20px 16px 60px; }
    header h1 { font-size: 30px; } #clock { font-size: 18px; }
    .row { grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .cards { grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .tile { min-height: 100px; padding: 14px; } .tile .name { font-size: 24px; } .tile .sub { font-size: 15px; }
    .card .t { font-size: 17px; } .card .i { font-size: 14px; }
    #searchBox { font-size: 22px; }
    #osd { font-size: 22px; left: 16px; top: 16px; } #status { font-size: 20px; bottom: 90px; }
    #bar button { font-size: 16px; padding: 10px 12px; }
  }
</style>
</head>
<body>
  <div id="home" class="screen scroll on">
    <header><h1>爸爸的电视</h1><div id="clock"></div></header>
    <p id="hint" class="hint"></p>
    <section id="continue" class="hidden"><h2>继续观看</h2><div class="cards"></div></section>
    <div id="groups"></div>
    <section id="vodGroup"><h2>点播 · 电视剧 电影</h2><div class="row"></div></section>
  </div>

  <div id="browse" class="screen scroll">
    <header><h1 id="browseTitle"></h1></header>
    <p class="hint">按 <b>返回</b> 回到频道列表</p>
    <input id="searchBox" class="hidden" type="search" placeholder="输入片名，例如：神雕侠侣、康熙王朝" autocomplete="off">
    <p id="browseMsg"></p>
    <div id="cards" class="cards"></div>
  </div>

  <div id="player" class="screen">
    <video id="video" playsinline></video>
    <div id="yt"></div>
    <div id="web"></div>
    <div id="osd" class="fade"></div>
    <div id="status" class="hidden"></div>
    <div id="bar" class="fade"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
  <script src="channels.js"></script>
  <script src="app.js"></script>
</body>
</html>
